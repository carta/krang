[project]
name = "krang"
version = "1.0.0"
description = "Knowledge, Reports, Alerts & Normalization Generator for Splunk"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "yamllint>=1.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib/splunkgen"]
